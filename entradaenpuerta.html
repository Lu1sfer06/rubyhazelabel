<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrada en Puerta — THE TRIBE PT.II | Ruby Haze</title>
<link rel="icon" type="image/x-icon" href="assets/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@200;300;400;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.payphonetodoesposible.com/box/v2.0/payphone-payment-box.css">
<script type="module" src="https://cdn.payphonetodoesposible.com/box/v2.0/payphone-payment-box.js"></script>
<style>
  :root{
    --red: #a2031a;
    --yellow: #dbce44;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  body{
    min-height: 100vh;
    background: #0a0a0a;
    color: #ffffff;
    font-family: 'Google Sans Flex', sans-serif;
    font-weight: 300;
  }

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 18px 6%;
    background: #000000;
  }
  header .logo-mark{ width: 150px; height: 56px; }
  header .logo-mark img{ width:100%; height:100%; object-fit: contain; }
  .back-link{
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #ffffff;
    transition: opacity 0.25s;
  }
  .back-link:hover{ opacity: 0.75; }

  #dayOfSection{
    position: relative;
    min-height: calc(100vh - 92px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 6% 80px;
    background:
      linear-gradient(180deg, rgba(10,10,10,0.55) 0%, rgba(10,10,10,0.75) 55%, rgba(10,10,10,0.95) 100%),
      url('eventos/gustavo%20web.jpg') center 40%/cover no-repeat;
  }
  .dayof-content{
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  .dayof-title{
    font-weight: 900;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    font-size: clamp(1.3rem, 7vw, 3.6rem);
    white-space: nowrap;
    color: var(--yellow);
    margin-bottom: 8px;
  }
  .dayof-sub{
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-size: clamp(1rem, 3.5vw, 1.3rem);
    color: #fff;
    margin-bottom: 34px;
  }
  .dayof-card{
    background: #ffffff;
    border-radius: 18px;
    padding: 30px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.5);
  }
  #pp-button-dayof{ display:flex; justify-content:center; }

  .qty-selector{ text-align:center; margin-bottom: 22px; }
  .qty-label{
    display:block;
    color:#111111;
    font-weight:700;
    font-size:0.8rem;
    letter-spacing:0.06em;
    text-transform:uppercase;
    margin-bottom:12px;
  }
  .qty-control{ display:flex; align-items:center; justify-content:center; gap:20px; margin-bottom:12px; }
  .qty-btn{
    width:36px;
    height:36px;
    border-radius:50%;
    border:none;
    background:#111111;
    color:#ffffff;
    font-size:1.2rem;
    font-weight:700;
    line-height:1;
    cursor:pointer;
  }
  .qty-btn:disabled{ opacity:0.3; cursor:not-allowed; }
  #dayQtyValue{ font-size:1.3rem; font-weight:800; color:#111111; min-width:24px; text-align:center; }
  .qty-total{ color:#111111; font-weight:700; font-size:0.95rem; margin-bottom: 22px; }
  .qty-total strong{ color: var(--red); font-weight:800; }

  footer{
    background: #000000;
    padding: 36px 8%;
    text-align: center;
  }
  footer .legal{
    font-size: 0.95rem;
    color: rgba(255,255,255,0.6);
    letter-spacing: 0.03em;
    max-width: 600px;
    margin: 0 auto;
  }
  footer .legal a{ color: rgba(255,255,255,0.6); text-decoration: underline; }
  footer .legal a:hover{ color: var(--yellow); }
</style>
</head>
<body>

<header>
  <div class="logo-mark"><img src="eventos/rombo%20blanco.png" alt="Ruby Haze"></div>
  <a class="back-link" href="/">&larr; Volver al inicio</a>
</header>

<section id="dayOfSection">
  <div class="dayof-content">
    <h1 class="dayof-title">THE TRIBE PT.II</h1>
    <p class="dayof-sub">Entrada en Puerta</p>
    <div class="dayof-card">
      <div class="qty-selector">
        <span class="qty-label">Cantidad de entradas</span>
        <div class="qty-control">
          <button type="button" class="qty-btn" id="dayQtyMinus" aria-label="Restar entrada">&minus;</button>
          <span id="dayQtyValue">1</span>
          <button type="button" class="qty-btn" id="dayQtyPlus" aria-label="Sumar entrada">+</button>
        </div>
        <p class="qty-total">Total a pagar: <strong id="dayQtyTotal">$20.92</strong></p>
      </div>
      <div id="pp-button-dayof"></div>
    </div>
  </div>
</section>

<footer>
  <div class="legal">© <span id="year"></span> Ruby Haze. Todos los derechos reservados. · Contacto: <a href="mailto:maison@rubyhazelabel.com">maison@rubyhazelabel.com</a></div>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>
<script>
  // Token/StoreId de la app "Ruby Haze Tickets" — la Cajita de Payphone
  // exige que estos valores vivan en el navegador.
  const CONFIG = {
    payphoneToken: '9ad8vjrkLEzpFwRti8WJorwelVfDCXOy5VNGJl8i5XkmTclGuP9PkJeiQ6yRxAm1-gqCSw8-9l46DC3UfV1R-0AsAbM5iExqxwNe61O8PkknV05E2hH3MTCuAemtxq6SxO2rX5CBIk2_eia0kmpVmYZ9yIp5p5vZveRGvYS93I_NXHRpmE-kNZIV1lS1bAmYjpqy67xVJzUhDmlzTIzRWU2pnYHyeWyHbh8OMjj7WFbZvGPYZ1xMKM8zc1wiyrbNoq6CIBlBSbjcCSgwJym2Wky9wjxr1Q2C9zZnzDO0wAGwItHdOgQOm5qyLfGM9_vnPxwqru5Nph6y9kb2-0t3EwBAt8k',
    payphoneStoreId: '6227abe0-9fc1-47cb-afdb-6505f3623b6f'
  };

  const PRICE_USD = 20.92;
  const MAX_QTY = 5;
  let quantity = 1;
  let payphoneReady = false;

  const qtyValueEl = document.getElementById('dayQtyValue');
  const qtyTotalEl = document.getElementById('dayQtyTotal');
  const qtyMinusBtn = document.getElementById('dayQtyMinus');
  const qtyPlusBtn = document.getElementById('dayQtyPlus');

  // El script de Payphone se carga como módulo (type="module"), que se
  // ejecuta después del parseo del HTML — si llamamos PPaymentButtonBox
  // de inmediato (script clásico corriendo durante el parseo), la clase
  // todavía no existe y el botón nunca se dibuja. Por eso esperamos a
  // DOMContentLoaded, y si por alguna razón el módulo tarda más, reintenta.
  function renderPayphoneButton(){
    if(typeof PPaymentButtonBox === 'undefined'){
      setTimeout(renderPayphoneButton, 150);
      return;
    }
    payphoneReady = true;

    const ppButtonEl = document.getElementById('pp-button-dayof');
    ppButtonEl.innerHTML = '';

    const amountCents = Math.round(PRICE_USD * quantity * 100);
    const clientTransactionId = 'RH-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
    const promotorCode = new URLSearchParams(location.search).get('pr') || '';

    fetch('/api/tickets/intent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ clientTransactionId, promotorCode, flow: 'doorentry' })
    }).catch((err) => console.error('No se pudo registrar el intento de entrada en puerta:', err));

    new PPaymentButtonBox({
      token: CONFIG.payphoneToken,
      clientTransactionId,
      amount: amountCents,
      amountWithoutTax: amountCents,
      amountWithTax: 0,
      tax: 0,
      currency: 'USD',
      storeId: CONFIG.payphoneStoreId,
      reference: `Ticket Ruby Haze — Entrada en Puerta x${quantity}`,
      lang: 'es'
    }).render('pp-button-dayof');
  }

  function updateQty(newQty){
    quantity = Math.min(MAX_QTY, Math.max(1, newQty));
    qtyValueEl.textContent = quantity;
    qtyTotalEl.textContent = `$${(PRICE_USD * quantity).toFixed(2)}`;
    qtyMinusBtn.disabled = quantity <= 1;
    qtyPlusBtn.disabled = quantity >= MAX_QTY;
    if(payphoneReady) renderPayphoneButton();
  }

  qtyMinusBtn.addEventListener('click', () => updateQty(quantity - 1));
  qtyPlusBtn.addEventListener('click', () => updateQty(quantity + 1));

  window.addEventListener('DOMContentLoaded', () => {
    updateQty(1);
    renderPayphoneButton();
  });
</script>

</body>
</html>
